# Headless bot for a small VPS. Put bot_config.json (with "remote": {"bind":
# "<tailnet IP>", "port": 8765, "token": "..."}) in ./state, chmod 600.
services:
  garden-bot:
    build: .
    container_name: garden-bot
    restart: unless-stopped
    # Host networking so the control API can bind the Tailscale address only.
    network_mode: host
    volumes:
      - ./state:/state
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
